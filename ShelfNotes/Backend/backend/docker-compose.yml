services:
  mysql:
    image: mysql:8.0
    container_name: shelfnote-mysql

    environment:
      MYSQL_DATABASE: shelfnotes
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: shelfnote-app

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/shelfnotes
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: 86400000

      FILE_UPLOAD_DIR: /app/uploads

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data: